<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ServEase — Dashboard</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ========== same sidebar + topbar styles as your original ========== */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      :root {
        --bg: #0d0f14;
        --surface: #13161e;
        --surface2: #1b1f2b;
        --border: #252934;
        --accent: #5c6bff;
        --accent2: #ff6b6b;
        --accent3: #43e8a0;
        --text: #e8eaf0;
        --muted: #6b7385;
        --sidebar-w: 240px;
      }
      body {
        height: 100vh;
        font-family: "DM Sans", sans-serif;
        font-size: 14px;
        background: var(--bg);
        color: var(--text);
        overflow: hidden;
      }
      .shell {
        display: flex;
        height: 100%;
      }
      .sidebar {
        width: var(--sidebar-w);
        background: var(--surface);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
      }
      .brand {
        padding: 28px 24px 24px;
        border-bottom: 1px solid var(--border);
      }
      .brand-logo {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .brand-icon {
        width: 34px;
        height: 34px;
        background: var(--accent);
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        box-shadow: 0 0 20px rgba(92, 107, 255, 0.4);
      }
      .brand-name {
        font-family: "Syne", sans-serif;
        font-weight: 800;
        font-size: 20px;
      }
      .brand-name span {
        color: var(--accent);
      }
      .brand-tag {
        font-size: 10px;
        color: var(--muted);
        letter-spacing: 1.5px;
        text-transform: uppercase;
        margin-top: 4px;
      }
      .nav {
        flex: 1;
        padding: 20px 12px;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .nav-section-label {
        font-size: 10px;
        letter-spacing: 1.8px;
        text-transform: uppercase;
        color: var(--muted);
        padding: 12px 12px 6px;
        font-weight: 500;
      }
      .nav-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 11px 14px;
        border-radius: 10px;
        cursor: pointer;
        color: var(--muted);
        font-size: 13.5px;
        transition: all 0.18s;
        border: 1px solid transparent;
      }
      .nav-item:hover {
        background: var(--surface2);
        color: var(--text);
        border-color: var(--border);
      }
      .nav-item.active {
        background: rgba(92, 107, 255, 0.12);
        color: #fff;
        border-color: rgba(92, 107, 255, 0.25);
      }
      .nav-icon {
        width: 18px;
        height: 18px;
      }
      .user-card {
        margin: 12px;
        padding: 14px;
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: 12px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .user-avatar {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 13px;
      }
      .user-info {
        flex: 1;
      }
      .user-name {
        font-size: 13px;
        font-weight: 500;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .user-role {
        font-size: 11px;
        color: var(--muted);
      }
      .main {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .topbar {
        height: 60px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        padding: 0 28px;
        gap: 16px;
        background: rgba(13, 15, 20, 0.8);
        backdrop-filter: blur(12px);
      }
      .page-title {
        font-family: "Syne", sans-serif;
        font-weight: 700;
        font-size: 17px;
        flex: 1;
      }
      .status-pill {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 14px;
        background: rgba(67, 232, 160, 0.1);
        border: 1px solid rgba(67, 232, 160, 0.25);
        border-radius: 20px;
        font-size: 12px;
        color: var(--accent3);
      }
      .status-dot {
        width: 6px;
        height: 6px;
        background: var(--accent3);
        border-radius: 50%;
        animation: pulse 2s infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.4;
        }
      }
      .content-area {
        flex: 1;
        position: relative;
        overflow: hidden;
      }
      iframe {
        width: 100%;
        height: 100%;
        border: none;
        background: var(--bg);
        display: none;
        opacity: 0;
        transition: opacity 0.2s;
      }
      iframe.visible {
        display: block;
        opacity: 1;
      }
      .frame-loader {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        z-index: 10;
        display: none;
      }
      .frame-loader.active {
        display: flex;
      }
      .loader-spinner {
        width: 36px;
        height: 36px;
        border: 3px solid var(--border);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .stats-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 14px;
        margin-bottom: 24px;
      }
      .stat-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 20px;
      }
      .stat-label {
        font-size: 12px;
        color: var(--muted);
        text-transform: uppercase;
      }
      .stat-value {
        font-family: "Syne", sans-serif;
        font-size: 26px;
        font-weight: 700;
        margin-top: 8px;
      }
      .home-panel {
        position: absolute;
        inset: 0;
        padding: 28px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 24px;
      }
      .home-panel.hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-logo">
            <div class="brand-icon">⚡</div>
            <div class="brand-name">Serv<span>Ease</span></div>
          </div>
          <div class="brand-tag">Service Provider</div>
        </div>
        <nav class="nav">
          <div class="nav-section-label">Main</div>
          <div class="nav-item active" data-page="home">
            <svg
              class="nav-icon"
              viewBox="0 0 20 20"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
            >
              <rect x="2" y="2" width="7" height="7" rx="2" />
              <rect x="11" y="2" width="7" height="7" rx="2" />
              <rect x="2" y="11" width="7" height="7" rx="2" />
              <rect x="11" y="11" width="7" height="7" rx="2" /></svg
            >Dashboard
          </div>
          <div class="nav-section-label">My Activity</div>
          <div class="nav-item" data-page="account">
            <svg
              class="nav-icon"
              viewBox="0 0 20 20"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
            >
              <circle cx="10" cy="7" r="3.5" />
              <path
                d="M3 17c0-3.314 3.134-6 7-6s7 2.686 7 6"
                stroke-linecap="round"
              /></svg
            >Account
          </div>
          <div class="nav-item" data-page="orders">
            <svg
              class="nav-icon"
              viewBox="0 0 20 20"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
            >
              <rect x="3" y="2" width="14" height="16" rx="2" />
              <path d="M7 7h6M7 11h6M7 15h3" stroke-linecap="round" /></svg
            >Orders
          </div>
          <div class="nav-item" data-page="wallet">
            <svg
              class="nav-icon"
              viewBox="0 0 20 20"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
            >
              <rect x="2" y="5" width="16" height="12" rx="2" />
              <path d="M2 9h16" />
              <circle
                cx="15"
                cy="13"
                r="1.5"
                fill="currentColor"
                stroke="none"
              /></svg
            >Wallet
          </div>
          <div class="nav-section-label">Manage</div>
          <div class="nav-item" data-page="settings">
            <svg
              class="nav-icon"
              viewBox="0 0 20 20"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
            >
              <circle cx="10" cy="10" r="2.5" />
              <path
                d="M10 2v2M10 16v2M2 10h2M16 10h2M4.1 4.1l1.4 1.4M14.5 14.5l1.4 1.4M4.1 15.9l1.4-1.4M14.5 5.5l1.4-1.4"
              /></svg
            >Settings
          </div>
        </nav>
        <div class="user-card">
          <div class="user-avatar" id="userAvatar">PR</div>
          <div class="user-info">
            <div class="user-name" id="userName">Provider</div>
            <div class="user-role">Pro Member</div>
          </div>
        </div>
      </aside>

      <div class="main">
        <header class="topbar">
          <div class="page-title" id="pageTitle">Dashboard</div>
          <div class="status-pill">
            <div class="status-dot"></div>
            Online
          </div>
        </header>
        <div class="content-area">
          <div class="frame-loader" id="frameLoader">
            <div class="loader-spinner"></div>
          </div>
          <iframe id="pageFrame" title="Page content"></iframe>
          <div class="home-panel" id="homePanel">
            <div class="stats-grid" id="statsGrid">
              <div class="stat-card">
                <div class="stat-label">Total Orders</div>
                <div class="stat-value" id="totalOrders">0</div>
              </div>
              <div class="stat-card">
                <div class="stat-label">Earnings</div>
                <div class="stat-value" id="earnings">₹0</div>
              </div>
              <div class="stat-card">
                <div class="stat-label">Active Orders</div>
                <div class="stat-value" id="activeOrders">0</div>
              </div>
              <div class="stat-card">
                <div class="stat-label">Rating</div>
                <div class="stat-value" id="rating">0</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      const token = localStorage.getItem("token");
      if (!token) {
        alert("You are not logged in. Redirecting to registration...");
        window.location.href = "provider-register.html";
      }

      // Extract provider ID from JWT
      function getProviderId() {
        try {
          const payload = JSON.parse(
            atob(token.split(".")[1].replace(/-/g, "+").replace(/_/g, "/")),
          );
          return payload.sub || payload.userId || payload.id || payload._id;
        } catch (e) {
          return null;
        }
      }
      const providerId = getProviderId();
      if (!providerId) {
        alert("Invalid token. Please log in again.");
        localStorage.removeItem("token");
        window.location.href = "provider-register.html";
      }

      // Set user name from localStorage
      const user = JSON.parse(localStorage.getItem("user") || "{}");
      const name =
        `${user.firstName || ""} ${user.lastName || ""}`.trim() || "Provider";
      document.getElementById("userName").innerText = name;
      document.getElementById("userAvatar").innerText = name
        .charAt(0)
        .toUpperCase();

      // Load dashboard stats
      fetch("http://localhost:5000/api/dashboard/provider", {
        headers: { Authorization: `Bearer ${token}` },
      })
        .then((res) => (res.ok ? res.json() : Promise.reject()))
        .then((data) => {
          document.getElementById("totalOrders").innerText =
            data.totalOrders || 0;
          document.getElementById("earnings").innerText =
            `₹${data.earnings || 0}`;
          document.getElementById("activeOrders").innerText =
            data.pendingOrders || 0;
          document.getElementById("rating").innerText =
            data.provider?.rating || 0;
        })
        .catch((err) => console.error("Stats error:", err));

      const frame = document.getElementById("pageFrame");
      const homePanel = document.getElementById("homePanel");
      const frameLoader = document.getElementById("frameLoader");
      const pageTitle = document.getElementById("pageTitle");

      function loadPage(page) {
        let url = "",
          title = "";
        switch (page) {
          case "home":
            showHome();
            return;
          case "account":
            url = "provider-account.html";
            title = "My Account";
            break;
          case "orders":
            url = "provider-orders.html";
            title = "My Orders";
            break;
          case "wallet":
            url = "provider-wallet.html";
            title = "My Wallet";
            break;
          case "settings":
            url = "provider-settings.html";
            title = "Settings";
            break;
          default:
            return;
        }
        pageTitle.innerText = title;
        homePanel.classList.add("hidden");
        frameLoader.classList.add("active");
        frame.classList.remove("visible");
        frame.onload = () => {
          frameLoader.classList.remove("active");
          frame.classList.add("visible");
        };
        frame.src = url;
      }

      function showHome() {
        pageTitle.innerText = "Dashboard";
        homePanel.classList.remove("hidden");
        frame.classList.remove("visible");
        frame.src = "";
        frameLoader.classList.remove("active");
      }

      document.querySelectorAll(".nav-item").forEach((item) => {
        item.addEventListener("click", () => {
          document
            .querySelectorAll(".nav-item")
            .forEach((nav) => nav.classList.remove("active"));
          item.classList.add("active");
          const page = item.getAttribute("data-page");
          loadPage(page);
        });
      });
    </script>
  </body>
</html>
