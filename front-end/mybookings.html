<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Bookings — ServEase</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --bg: #0d0f14;
        --surface: #13161e;
        --surface2: #1b1f2b;
        --border: #252934;
        --accent: #5c6bff;
        --accent2: #ff6b6b;
        --accent3: #43e8a0;
        --text: #e8eaf0;
        --muted: #6b7385;
      }
      body {
        font-family: "DM Sans", sans-serif;
        background: var(--bg);
        color: var(--text);
        padding: 20px;
      }
      .container {
        max-width: 900px;
        margin: 0 auto;
      }
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 24px;
      }
      .header h1 {
        font-family: "Syne", sans-serif;
        font-size: 28px;
        font-weight: 700;
        color: var(--text);
      }
      .filter-tabs {
        display: flex;
        gap: 8px;
        margin-bottom: 20px;
      }
      .filter-btn {
        padding: 8px 16px;
        border: 1px solid var(--border);
        background: var(--surface2);
        color: var(--muted);
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.2s;
        font-size: 13px;
        font-weight: 500;
      }
      .filter-btn.active {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent);
      }
      .filter-btn:hover {
        border-color: var(--accent);
        color: var(--text);
      }

      .booking-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 20px;
        margin-bottom: 14px;
        display: flex;
        gap: 16px;
        align-items: center;
        transition: all 0.2s;
      }
      .booking-card:hover {
        border-color: var(--accent);
        box-shadow: 0 4px 16px rgba(92, 107, 255, 0.15);
      }
      .booking-icon {
        font-size: 40px;
        min-width: 60px;
        text-align: center;
      }
      .booking-info {
        flex: 1;
      }
      .booking-name {
        font-size: 16px;
        font-weight: 600;
        color: var(--text);
        margin-bottom: 4px;
      }
      .booking-meta {
        font-size: 12px;
        color: var(--muted);
        display: flex;
        gap: 16px;
        margin-bottom: 8px;
      }
      .booking-status {
        display: inline-block;
        font-size: 11px;
        font-weight: 600;
        padding: 4px 10px;
        border-radius: 20px;
        margin-bottom: 8px;
      }
      .status-active {
        background: rgba(67, 232, 160, 0.15);
        color: var(--accent3);
      }
      .status-completed {
        background: rgba(92, 107, 255, 0.15);
        color: #8b9aff;
      }
      .status-cancelled {
        background: rgba(255, 107, 107, 0.15);
        color: var(--accent2);
      }

      .booking-actions {
        display: flex;
        gap: 8px;
      }
      .btn {
        padding: 8px 14px;
        border: none;
        border-radius: 8px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
      }
      .btn-primary {
        background: var(--accent);
        color: #fff;
      }
      .btn-primary:hover {
        background: #4a58e8;
      }
      .btn-secondary {
        background: var(--surface2);
        color: var(--muted);
        border: 1px solid var(--border);
      }
      .btn-secondary:hover {
        color: var(--text);
        border-color: var(--accent);
      }

      .empty-state {
        text-align: center;
        padding: 60px 20px;
        color: var(--muted);
      }
      .empty-icon {
        font-size: 48px;
        margin-bottom: 12px;
      }
      .empty-text {
        font-size: 14px;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>My Bookings</h1>
      </div>

      <div class="filter-tabs">
        <button class="filter-btn active" onclick="filterBookings('all')">
          All
        </button>
        <button class="filter-btn" onclick="filterBookings('active')">
          Active
        </button>
        <button class="filter-btn" onclick="filterBookings('completed')">
          Completed
        </button>
        <button class="filter-btn" onclick="filterBookings('cancelled')">
          Cancelled
        </button>
      </div>

      <div id="bookings-list">
        <!-- Loaded from API -->
      </div>

      <div id="empty-state" class="empty-state" style="display: none">
        <div class="empty-icon">📅</div>
        <div class="empty-text">No bookings found</div>
      </div>
    </div>

    <script>
      const API_BASE_URL = "http://localhost:5000";
      let currentFilter = "all";
      async function loadBookings() {
        const token = localStorage.getItem("token");
        if (!token) {
          window.location.href = "ServEase1.html";
          return;
        }
        const res = await fetch(`${API_BASE_URL}/api/bookings/my-bookings`, {
          headers: { Authorization: `Bearer ${token}` },
        });
        const bookings = await res.json();
        window.allBookings = bookings;
        renderBookings();
      }
      function renderBookings() {
        let filtered = window.allBookings || [];
        if (currentFilter !== "all")
          filtered = filtered.filter((b) => b.status === currentFilter);
        const container = document.getElementById("bookings-list");
        const empty = document.getElementById("empty-state");
        if (!filtered.length) {
          empty.style.display = "block";
          container.innerHTML = "";
          return;
        }
        empty.style.display = "none";
        container.innerHTML = filtered
          .map(
            (b) => `
      <div class="booking-card">
        <div class="booking-icon">${b.serviceId?.icon || "🔧"}</div>
        <div class="booking-info">
          <div class="booking-name">${b.serviceId?.name || "Service"}</div>
          <div class="booking-meta">
            <span>By ${b.providerId?.businessName || "Provider"}</span>
            <span>📅 ${new Date(b.scheduledTime).toDateString()}</span>
          </div>
          <span class="booking-status status-${b.status}">${b.status.toUpperCase()}</span>
        </div>
        <div style="text-align:right">
          <div style="font-size:18px;font-weight:700">₹${b.totalAmount}</div>
          <div class="booking-actions">
            <button class="btn btn-secondary" onclick="alert('Details')">Details</button>
          </div>
        </div>
      </div>
    `,
          )
          .join("");
      }
      function filterBookings(filter) {
        currentFilter = filter;
        renderBookings();
      }
      loadBookings();
    </script>
  </body>
</html>
