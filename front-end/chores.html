<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chores — ServEase</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d0f14;
      --surface:   #13161e;
      --surface2:  #1b1f2b;
      --border:    #252934;
      --accent:    #5c6bff;
      --accent2:   #ff6b6b;
      --accent3:   #43e8a0;
      --text:      #e8eaf0;
      --muted:     #6b7385;
    }

    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
    }

    /* ── PAGE ── */
    .page {
      max-width: 780px;
      margin: 0 auto;
      padding: 32px 24px 60px;
    }

    /* ── HEADER ── */
    .page-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      margin-bottom: 28px;
      gap: 16px;
    }

    .page-header h1 {
      font-family: 'Syne', sans-serif;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--text);
    }

    .page-header h1 span { color: var(--accent); }

    .item-count {
      font-size: 12px;
      color: var(--muted);
      background: var(--surface2);
      border: 1px solid var(--border);
      padding: 4px 12px;
      border-radius: 20px;
    }

    /* ── LOADING / ERROR / EMPTY ── */
    .state-box {
      text-align: center;
      padding: 60px 20px;
      border: 1px dashed var(--border);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .state-icon {
      font-size: 42px;
      animation: pulse 1.6s ease-in-out infinite;
    }

    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

    .state-box h3 {
      font-family: 'Syne', sans-serif;
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
    }

    .state-box p { color: var(--muted); font-size: 13px; line-height: 1.6; }

    .spinner {
      width: 32px; height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── CHORES LIST ── */
    .chores-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 24px;
    }

    .chore-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      transition: border-color 0.18s, transform 0.18s;
      animation: slideIn 0.3s ease both;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .chore-card:hover {
      border-color: rgba(92,107,255,.3);
      transform: translateY(-1px);
    }

    .chore-thumb {
      width: 46px; height: 46px;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }

    .chore-info { flex: 1; min-width: 0; }

    .chore-name {
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 3px;
    }

    .chore-meta {
      font-size: 12px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .chore-meta .tag {
      background: var(--surface2);
      border: 1px solid var(--border);
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 11px;
    }

    .chore-price {
      font-family: 'Syne', sans-serif;
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      min-width: 64px;
      text-align: right;
      flex-shrink: 0;
    }

    .remove-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      padding: 4px;
      border-radius: 6px;
      transition: color 0.15s, background 0.15s;
      display: flex; align-items: center;
      flex-shrink: 0;
    }
    .remove-btn:hover { color: var(--accent2); background: rgba(255,107,107,.08); }

    /* ── SUMMARY CARD ── */
    .summary-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
    }

    .summary-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      font-family: 'Syne', sans-serif;
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
    }

    .summary-body { padding: 16px 20px; }

    .summary-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      font-size: 13px;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
    }

    .summary-row:last-of-type { border-bottom: none; }

    .summary-row .val { color: var(--text); font-weight: 500; }

    .summary-total {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      background: rgba(92,107,255,.06);
      border-top: 1px solid rgba(92,107,255,.2);
    }

    .summary-total .label {
      font-family: 'Syne', sans-serif;
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
    }

    .summary-total .amount {
      font-family: 'Syne', sans-serif;
      font-size: 22px;
      font-weight: 800;
      color: var(--accent3);
    }

    /* ── CONTINUE BUTTON ── */
    .continue-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 14px 20px;
      margin-top: 14px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-family: 'Syne', sans-serif;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.2px;
      box-shadow: 0 4px 20px rgba(92,107,255,.3);
      transition: background 0.18s, transform 0.18s, box-shadow 0.18s;
    }

    .continue-btn:hover {
      background: #4a58e8;
      transform: translateY(-1px);
      box-shadow: 0 6px 28px rgba(92,107,255,.4);
    }

    .continue-btn:active { transform: translateY(0); }

    .continue-btn:disabled {
      background: var(--border);
      color: var(--muted);
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
    }

    .clear-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      background: none;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 13px;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
    }
    .clear-btn:hover { color: var(--accent2); border-color: rgba(255,107,107,.3); }

    /* ── TOAST ── */
    .toast {
      position: fixed;
      bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 20px;
      font-size: 13px;
      color: var(--text);
      transition: transform 0.3s ease;
      z-index: 100;
      white-space: nowrap;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }

    /* scrollbar */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }
  </style>
</head>
<body>

<div class="page">

  <div class="page-header">
    <h1>My <span>Chores</span></h1>
    <span class="item-count" id="item-count">0 items</span>
  </div>

  <div id="root"></div>

</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
  const API_BASE_URL = 'http://localhost:5000';

  /* ═══════════════════════════════════════════════
     DATABASE/API LAYER
   ═══════════════════════════════════════════════ */
  async function fetchChoresFromDB() {
    const token = localStorage.getItem('token');
    if (token) {
      const res = await fetch(`${API_BASE_URL}/api/dashboard/chores`, {
        headers: {
          Authorization: `Bearer ${token}`
        }
      });

      if (!res.ok) {
        throw new Error('Unable to fetch chores');
      }

      const payload = await res.json();
      const choresFromApi = Array.isArray(payload.chores) ? payload.chores : [];
      return choresFromApi.map((task, index) => ({
        id: task._id || index + 1,
        name: task.title || task.service || 'Service',
        provider: task.providerId?.businessName || task.providerId?.name || 'Assigned Provider',
        category: task.category || 'General',
        emoji: '🧰',
        color: 'rgba(92,107,255,.1)',
        price: Number(task.finalPrice || task.budget || 0),
        qty: 1,
        scheduled: task.scheduledDate
          ? new Date(task.scheduledDate).toLocaleDateString()
          : 'TBD'
      }));
    }

    return [
      {
        id: 1,
        name: 'Deep House Cleaning',
        provider: 'CleanNest Pro',
        category: 'Cleaning',
        emoji: '🧹',
        color: 'rgba(92,107,255,.1)',
        price: 49.99,
        qty: 1,
        scheduled: 'May 3, 2026'
      },
      {
        id: 2,
        name: 'Plumbing Inspection',
        provider: 'FixFlow Services',
        category: 'Plumbing',
        emoji: '🔧',
        color: 'rgba(67,232,160,.1)',
        price: 35.00,
        qty: 1,
        scheduled: 'May 5, 2026'
      },
      {
        id: 3,
        name: 'Electrical Safety Check',
        provider: 'SparkSafe Electricals',
        category: 'Electrical',
        emoji: '⚡',
        color: 'rgba(255,200,50,.1)',
        price: 60.00,
        qty: 2,
        scheduled: 'May 7, 2026'
      },
      {
        id: 4,
        name: 'Appliance Repair — AC Unit',
        provider: 'CoolTech Repairs',
        category: 'Appliances',
        emoji: '❄️',
        color: 'rgba(100,180,255,.1)',
        price: 80.00,
        qty: 1,
        scheduled: 'May 10, 2026'
      }
    ];
  }

  /* ═══════════════════════════════════════════════
     STATE
  ═══════════════════════════════════════════════ */
  let chores = [];
  let status = 'loading'; // loading | success | empty | error

  const root       = document.getElementById('root');
  const itemCount  = document.getElementById('item-count');
  const toastEl    = document.getElementById('toast');
  let toastTimer;

  /* ═══════════════════════════════════════════════
     RENDER
  ═══════════════════════════════════════════════ */
  function render() {
    root.innerHTML = '';

    if (status === 'loading') {
      root.innerHTML = `
        <div class="state-box">
          <div class="spinner"></div>
          <h3>Loading your chores…</h3>
          <p>Fetching saved services from the database.</p>
        </div>`;
      return;
    }

    if (status === 'error') {
      root.innerHTML = `
        <div class="state-box">
          <div class="state-icon">⚠️</div>
          <h3>Could not load chores</h3>
          <p>There was a problem connecting to the server.<br>Please try again.</p>
          <button onclick="load()" style="margin-top:8px;padding:8px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:13px;">Retry</button>
        </div>`;
      return;
    }

    if (status === 'empty' || chores.length === 0) {
      itemCount.textContent = '0 items';
      root.innerHTML = `
        <div class="state-box">
          <div class="state-icon" style="animation:none;font-size:48px">🛒</div>
          <h3>No chores saved yet</h3>
          <p>Browse services and save them here to build your chores list.</p>
        </div>`;
      return;
    }

    // Update count badge
    const totalItems = chores.reduce((s, c) => s + c.qty, 0);
    itemCount.textContent = `${totalItems} item${totalItems !== 1 ? 's' : ''}`;

    // Build list
    const list = document.createElement('div');
    list.className = 'chores-list';

    chores.forEach((ch, i) => {
      const card = document.createElement('div');
      card.className = 'chore-card';
      card.style.animationDelay = (i * 0.06) + 's';
      card.innerHTML = `
        <div class="chore-thumb" style="background:${ch.color}">${ch.emoji}</div>
        <div class="chore-info">
          <div class="chore-name">${ch.name}</div>
          <div class="chore-meta">
            <span>${ch.provider}</span>
            <span class="tag">${ch.category}</span>
            <span>📅 ${ch.scheduled}</span>
          </div>
        </div>

        <div class="chore-price">$${(ch.price * ch.qty).toFixed(2)}</div>
        <button class="remove-btn" onclick="removeChore(${ch.id})" title="Remove">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
            <path d="M3 4h10M6 4V2.5a.5.5 0 01.5-.5h3a.5.5 0 01.5.5V4M6 7v5M10 7v5"/>
            <rect x="2.5" y="4" width="11" height="9.5" rx="1.5"/>
          </svg>
        </button>`;
      list.appendChild(card);
    });

    root.appendChild(list);

    // Build summary
    const subtotal  = chores.reduce((s, c) => s + c.price * c.qty, 0);
    const tax       = subtotal * 0.05;
    const total     = subtotal + tax;

    const summary = document.createElement('div');
    summary.className = 'summary-card';
    summary.innerHTML = `
      <div class="summary-header">Order summary</div>
      <div class="summary-body">
        <div class="summary-row"><span>Subtotal (${totalItems} item${totalItems !== 1 ? 's' : ''})</span><span class="val">$${subtotal.toFixed(2)}</span></div>
        <div class="summary-row"><span>Service tax (5%)</span><span class="val">$${tax.toFixed(2)}</span></div>
        <div class="summary-row"><span>Platform fee</span><span class="val">Free</span></div>
      </div>
      <div class="summary-total">
        <span class="label">Total</span>
        <span class="amount">$${total.toFixed(2)}</span>
      </div>`;

    const continueBtn = document.createElement('button');
    continueBtn.className = 'continue-btn';
    continueBtn.innerHTML = `Continue to checkout <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10M9 4l4 4-4 4"/></svg>`;
    continueBtn.onclick = handleCheckout;

    const clearBtn = document.createElement('button');
    clearBtn.className = 'clear-btn';
    clearBtn.textContent = 'Clear all chores';
    clearBtn.onclick = clearAll;

    root.appendChild(summary);
    root.appendChild(continueBtn);
    root.appendChild(clearBtn);
  }

  /* ═══════════════════════════════════════════════
     ACTIONS
  ═══════════════════════════════════════════════ */
  function removeChore(id) {
    chores = chores.filter(c => c.id !== id);
    if (chores.length === 0) status = 'empty';
    render();
    showToast('Service removed from chores');
  }

  function clearAll() {
    if (!confirm('Remove all chores from your list?')) return;
    chores = [];
    status = 'empty';
    render();
    showToast('All chores cleared');
  }

  function handleCheckout() {
    showToast('Redirecting to checkout… (connect your checkout page)');
  }

  /* ═══════════════════════════════════════════════
     TOAST
  ═══════════════════════════════════════════════ */
  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2800);
  }

  /* ═══════════════════════════════════════════════
     LOAD FROM DB
  ═══════════════════════════════════════════════ */
  async function load() {
    status = 'loading';
    render();
    try {
      const data = await fetchChoresFromDB();
      chores = data;
      status = data.length === 0 ? 'empty' : 'success';
    } catch (e) {
      console.error('DB fetch error:', e);
      status = 'error';
    }
    render();
  }

  // Kick off
  load();
</script>
</body>
</html>
