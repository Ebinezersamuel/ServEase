<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Account — ServEase</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --bg: #0d0f14;
        --surface: #13161e;
        --surface2: #1b1f2b;
        --border: #252934;
        --accent: #5c6bff;
        --accent2: #ff6b6b;
        --accent3: #43e8a0;
        --text: #e8eaf0;
        --muted: #6b7385;
      }
      body {
        font-family: "DM Sans", sans-serif;
        background: var(--bg);
        color: var(--text);
        padding: 20px;
      }
      .container {
        max-width: 700px;
        margin: 0 auto;
      }
      .header h1 {
        font-family: "Syne", sans-serif;
        font-size: 28px;
        font-weight: 700;
        margin-bottom: 24px;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 24px;
        margin-bottom: 16px;
      }
      .card-title {
        font-size: 16px;
        font-weight: 700;
        margin-bottom: 16px;
        color: var(--text);
      }
      .form-group {
        margin-bottom: 16px;
      }
      .form-group label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        color: var(--muted);
        margin-bottom: 6px;
        text-transform: uppercase;
      }
      .form-group input,
      .form-group textarea {
        width: 100%;
        padding: 12px;
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: 10px;
        color: var(--text);
        font-family: inherit;
        font-size: 13px;
        outline: none;
        transition: border-color 0.2s;
      }
      .form-group input:focus,
      .form-group textarea:focus {
        border-color: var(--accent);
      }
      .form-group textarea {
        resize: vertical;
        min-height: 100px;
      }

      .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      .btn {
        padding: 12px 24px;
        border: none;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
        font-family: inherit;
      }
      .btn-primary {
        background: var(--accent);
        color: #fff;
      }
      .btn-primary:hover {
        background: #4a58e8;
      }
      .btn-secondary {
        background: var(--surface2);
        color: var(--muted);
        border: 1px solid var(--border);
      }
      .btn-secondary:hover {
        color: var(--text);
        border-color: var(--accent);
      }

      .button-group {
        display: flex;
        gap: 12px;
      }

      .info-item {
        display: flex;
        justify-content: space-between;
        padding: 12px 0;
        border-bottom: 1px solid var(--border);
      }
      .info-item:last-child {
        border-bottom: none;
      }
      .info-label {
        color: var(--muted);
        font-size: 13px;
      }
      .info-value {
        font-weight: 600;
        color: var(--text);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>My Account</h1>
      </div>

      <!-- Profile Info -->
      <div class="card">
        <div class="card-title">Profile Information</div>
        <div class="form-row">
          <div class="form-group">
            <label>First Name</label>
            <input
              type="text"
              id="firstName"
              placeholder="First name"
              value="John"
            />
          </div>
          <div class="form-group">
            <label>Last Name</label>
            <input
              type="text"
              id="lastName"
              placeholder="Last name"
              value="Doe"
            />
          </div>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input
            type="email"
            id="email"
            placeholder="Email"
            value="john@example.com"
          />
        </div>
        <div class="form-group">
          <label>Phone Number</label>
          <input
            type="tel"
            id="phone"
            placeholder="Phone"
            value="+91 98765 43210"
          />
        </div>
        <div class="button-group">
          <button class="btn btn-primary" onclick="saveProfile()">
            Save Changes
          </button>
          <button class="btn btn-secondary" onclick="alert('Cancelled')">
            Cancel
          </button>
        </div>
      </div>

      <!-- Address -->
      <div class="card">
        <div class="card-title">Address</div>
        <div class="form-group">
          <label>Street Address</label>
          <input
            type="text"
            placeholder="Street address"
            value="123 Main Street"
          />
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>City</label>
            <input type="text" placeholder="City" value="Mumbai" />
          </div>
          <div class="form-group">
            <label>State</label>
            <input type="text" placeholder="State" value="Maharashtra" />
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>ZIP Code</label>
            <input type="text" placeholder="ZIP code" value="400001" />
          </div>
          <div class="form-group">
            <label>Country</label>
            <input type="text" placeholder="Country" value="India" />
          </div>
        </div>
        <button class="btn btn-primary" onclick="alert('Address updated')">
          Update Address
        </button>
      </div>

      <!-- Security -->
      <div class="card">
        <div class="card-title">Security</div>
        <div class="form-group">
          <label>Current Password</label>
          <input type="password" placeholder="Current password" />
        </div>
        <div class="form-group">
          <label>New Password</label>
          <input type="password" placeholder="New password" />
        </div>
        <div class="form-group">
          <label>Confirm Password</label>
          <input type="password" placeholder="Confirm password" />
        </div>
        <button class="btn btn-primary" onclick="alert('Password updated')">
          Change Password
        </button>
      </div>

      <!-- Account Status -->
      <div class="card">
        <div class="card-title">Account Status</div>
        <div class="info-item">
          <span class="info-label">Member Since</span>
          <span class="info-value">January 15, 2024</span>
        </div>
        <div class="info-item">
          <span class="info-label">Account Type</span>
          <span class="info-value">Premium</span>
        </div>
        <div class="info-item">
          <span class="info-label">Total Bookings</span>
          <span class="info-value">12</span>
        </div>
        <div class="info-item">
          <span class="info-label">Rating</span>
          <span class="info-value">4.8 ⭐</span>
        </div>
      </div>

      <!-- Danger Zone -->
      <div
        class="card"
        style="
          border-color: rgba(255, 107, 107, 0.3);
          background: rgba(255, 107, 107, 0.06);
        "
      >
        <div class="card-title" style="color: var(--accent2)">Danger Zone</div>
        <p style="font-size: 13px; color: var(--muted); margin-bottom: 16px">
          Once you delete your account, there is no going back. Please be
          certain.
        </p>
        <button
          class="btn"
          style="background: var(--accent2); color: #fff"
          onclick="if (confirm('Delete account?')) alert('Account deleted');"
        >
          Delete Account
        </button>
      </div>
    </div>

    <script>
      async function loadProfile() {
        const token = localStorage.getItem("token");
        if (!token) {
          window.location.href = "ServEase1.html";
          return;
        }
        try {
          const res = await fetch("http://localhost:5000/api/dashboard", {
            headers: { Authorization: `Bearer ${token}` },
          });
          const data = await res.json();
          // update form fields
          const user = JSON.parse(localStorage.getItem("user") || "{}");
          document.getElementById("firstName").value = user.firstName || "";
          document.getElementById("lastName").value = user.lastName || "";
          document.getElementById("email").value = user.email || "";
          // optionally show total bookings
        } catch (err) {
          console.error(err);
        }
      }
      function saveProfile() {
        alert("Profile update will be available soon.");
      }
      loadProfile();
    </script>
  </body>
</html>
